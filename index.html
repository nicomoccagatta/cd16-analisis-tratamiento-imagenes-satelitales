<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CD.16 — Imágenes</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e2;
    --accent: #2563eb;
    --accent-bg: #eef2ff;
    --mono-bg: #f1f1f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15161a;
      --card-bg: #1e2025;
      --text: #eaeaea;
      --muted: #9a9a9a;
      --border: #2c2e33;
      --accent: #7aa2ff;
      --accent-bg: #202544;
      --mono-bg: #26282e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    max-width: 900px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 1rem;
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.35rem; }
  header p { color: var(--muted); margin: 0; font-size: 0.95rem; }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 1rem 1.5rem 3rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    display: block;
    background: var(--mono-bg);
  }
  .card-body {
    padding: 0.75rem 0.85rem 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .card-name {
    font-size: 0.85rem;
    word-break: break-word;
  }
  .link-row {
    display: flex;
    gap: 0.4rem;
  }
  .link-row input {
    flex: 1;
    min-width: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.72rem;
    padding: 0.4rem 0.5rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--mono-bg);
    color: var(--text);
  }
  .link-row button {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    font-size: 0.72rem;
    cursor: pointer;
  }
  .link-row button:active { transform: translateY(1px); }
  .empty {
    color: var(--muted);
    font-size: 0.9rem;
    grid-column: 1 / -1;
  }
</style>
</head>
<body>
<header>
  <h1>CD.16 — Análisis y Tratamiento de Imágenes Satelitales</h1>
  <p>Links directos a las imágenes estáticas alojadas en <code>/assets</code>.</p>
</header>
<main id="gallery">
  <p class="empty">Cargando…</p>
</main>
<script>
  // Agregar acá el nombre de cada archivo nuevo dentro de assets/
  const IMAGES = [
    "Screenshot at Sep 08 10-53-34.png"
  ];

  const gallery = document.getElementById("gallery");

  function buildUrl(name) {
    const base = new URL("assets/", window.location.href);
    return new URL(encodeURIComponent(name), base).href;
  }

  if (IMAGES.length === 0) {
    gallery.innerHTML = '<p class="empty">Todavía no hay imágenes en assets/.</p>';
  } else {
    gallery.innerHTML = "";
    for (const name of IMAGES) {
      const url = buildUrl(name);

      const card = document.createElement("div");
      card.className = "card";

      const img = document.createElement("img");
      img.src = url;
      img.alt = name;
      img.loading = "lazy";

      const body = document.createElement("div");
      body.className = "card-body";

      const label = document.createElement("div");
      label.className = "card-name";
      label.textContent = name;

      const row = document.createElement("div");
      row.className = "link-row";

      const input = document.createElement("input");
      input.type = "text";
      input.readOnly = true;
      input.value = url;

      const button = document.createElement("button");
      button.type = "button";
      button.textContent = "Copiar";
      button.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(url);
          button.textContent = "¡Listo!";
          setTimeout(() => { button.textContent = "Copiar"; }, 1200);
        } catch {
          input.select();
          document.execCommand("copy");
        }
      });

      row.append(input, button);
      body.append(label, row);
      card.append(img, body);
      gallery.appendChild(card);
    }
  }
</script>
</body>
</html>
